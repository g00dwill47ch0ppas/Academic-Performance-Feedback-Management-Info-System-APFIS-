<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academic Performance Monitoring — NWU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        // Same theme key and class as the lecturer system, applied before first paint.
        try {
            if (localStorage.getItem("spa-theme") === "dark") {
                document.documentElement.classList.add("dark-mode");
            }
        } catch (e) { /* storage unavailable: stay light */ }
    </script>
    <style>
        /* ===========================================================
           Gateway popup: same visual system as the Lecturer DSS and the
           Student Performance Assistant (palette, type, navbar, footer).
           =========================================================== */
        :root {
            --primary: #4E2A84;
            --primary-dark: #3a1f63;
            --secondary: #6A49A5;
            --accent: #F5B301;
            --background: #F8F9FC;
            --card: #FFFFFF;
            --text: #2D3436;
            --text-muted: #6c757d;
            --border: #e6e8ef;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow-lg: 0 14px 40px rgba(78, 42, 132, 0.18);
        }

        html.dark-mode {
            --background: #121212;
            --card: #1e1e1e;
            --text: #f1f1f1;
            --text-muted: #b8b8b8;
            --border: #333333;
            --primary: #6A49A5;
            --primary-dark: #24133f;
            --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            font-size: 18px;
            line-height: 1.5;
            background: var(--background);
            color: var(--text);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .icon { width: 20px; height: 20px; display: block; }

        /* ---------- Page behind the popup: navbar, backdrop art, footer ---------- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            height: 70px;
            padding: 0 30px;
            background: var(--primary);
            border-bottom: 4px solid var(--primary-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .logo {
            flex: 0 0 auto;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffffff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo .icon { width: 24px; height: 24px; }
        .title-group { min-width: 0; }
        .title-group h1 {
            margin: 0;
            font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
            font-size: 1.5rem;
            line-height: 1.25;
            color: #ffffff;
        }
        .title-group p {
            margin: 0;
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .backdrop {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            opacity: 0.08;
        }
        .backdrop .icon { width: min(60vh, 420px); height: min(60vh, 420px); }

        .footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border);
            background: var(--card);
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
        }

        /* ---------- The popup ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(22, 10, 42, 0.58);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            overflow-y: auto;
        }

        .dialog {
            position: relative;
            width: min(440px, 100%);
            margin: auto;
            padding: 2.5rem 2rem 2.25rem;
            border-radius: var(--radius);
            background: var(--primary);
            color: #ffffff;
            text-align: center;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            animation: pop 0.35s cubic-bezier(.2, .9, .3, 1.2) both;
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(18px) scale(0.95); }
            to   { opacity: 1; transform: none; }
        }

        .dialog-icon {
            width: 112px;
            height: 112px;
            margin: 0 auto 0.5rem;
            color: #ffffff;
        }
        .dialog-icon svg { width: 100%; height: 100%; display: block; }
        .dialog-icon .accent { color: var(--accent); }

        .dialog h2 {
            margin: 0 0 1.1rem;
            font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
            font-weight: 800;
            font-size: clamp(2.6rem, 11vw, 3.4rem);
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: #ffffff;
        }
        .dialog p.lead {
            margin: 0 auto 1.75rem;
            max-width: 30ch;
            font-size: 1.15rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.92);
        }

        /* Theme toggle (kept in the popup corner so it stays reachable) */
        .theme-toggle {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 42px;
            height: 42px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .theme-toggle:hover { background: #ffffff; color: var(--primary); }

        /* Role buttons */
        .choices {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .choice {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }
        .choice-btn {
            display: block;
            padding: 0.95rem 0.75rem;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: #2A1B00;
            font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.2;
            text-decoration: none;
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }
        .choice-btn:hover {
            background: #ffffff;
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9bfdc; }
        .status[data-state="on"] .dot  { background: #7BE3B0; }
        .status[data-state="off"] .dot { background: #FFB4A6; }

        /* Not-running notice, inside the popup */
        #notice {
            display: none;
            margin-top: 1.4rem;
            padding: 0.9rem 1rem;
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, 0.22);
            text-align: left;
            font-size: 0.98rem;
            line-height: 1.5;
        }
        #notice code {
            display: block;
            margin-top: 0.55rem;
            padding: 0.55rem 0.75rem;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            font-family: ui-monospace, Consolas, monospace;
            font-size: 0.92rem;
            color: #ffe08a;
            overflow-wrap: break-word;
        }

        .dialog:focus { outline: none; }
        :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 3px; }
        .dialog :focus-visible, .navbar :focus-visible { outline-color: #ffffff; }

        @media (max-width: 420px) {
            .navbar { padding: 0 16px; }
            .title-group h1 { font-size: 1.15rem; }
            .dialog { padding: 2.25rem 1.25rem 1.75rem; }
            .choices { flex-direction: column; }
            .choice { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
            .dialog { animation: none; }
            .choice-btn:hover { transform: none; }
        }
    </style>
</head>
<body>

    <!-- Shared inline icon sprite (stroke = currentColor, Feather style, same as the apps) -->
    <svg class="svg-sprite" aria-hidden="true" focusable="false">
        <symbol id="i-grad" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 9.5 12 5 2 9.5l10 4.5 10-4.5z"/>
                <path d="M6 11.6V17c0 1.6 2.7 2.8 6 2.8s6-1.2 6-2.8v-5.4"/>
                <line x1="22" y1="9.5" x2="22" y2="15"/>
            </g>
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </g>
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <line x1="12" y1="2" x2="12" y2="4"/>
                <line x1="12" y1="20" x2="12" y2="22"/>
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/>
                <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
                <line x1="2" y1="12" x2="4" y2="12"/>
                <line x1="20" y1="12" x2="22" y2="12"/>
                <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/>
                <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
            </g>
        </symbol>
    </svg>

    <!-- Page behind the popup -->
    <nav class="navbar" aria-label="Main">
        <div class="logo" aria-hidden="true"><svg class="icon"><use href="#i-grad"></use></svg></div>
        <div class="title-group">
            <h1>NWU Academic Performance Monitoring</h1>
            <p>Lecturer DSS &middot; Student Performance Assistant</p>
        </div>
    </nav>

    <div class="backdrop" aria-hidden="true">
        <svg class="icon"><use href="#i-grad"></use></svg>
    </div>

    <footer class="footer">
        Research prototype &mdash; G. O. G. Sebaetse, T. Ndlakuse &middot; NWU Potchefstroom Campus
    </footer>

    <!-- The gateway popup -->
    <div class="overlay">
        <main class="dialog" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDesc">

            <button type="button" class="theme-toggle" id="darkModeToggle"
                    aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
                <svg class="icon" id="themeIconMoon" aria-hidden="true"><use href="#i-moon"></use></svg>
                <svg class="icon" id="themeIconSun" aria-hidden="true" hidden><use href="#i-sun"></use></svg>
            </button>

            <div class="dialog-icon" aria-hidden="true">
                <!-- Graduation cap, drawn larger with a thinner line, like the cookie in the reference -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 9.5 12 5 2 9.5l10 4.5 10-4.5z"/>
                    <path d="M6 11.6V17c0 1.6 2.7 2.8 6 2.8s6-1.2 6-2.8v-5.4"/>
                    <line x1="22" y1="9.5" x2="22" y2="15"/>
                    <circle class="accent" cx="22" cy="16.2" r="0.9" fill="currentColor" stroke="none"/>
                </svg>
            </div>

            <h2 id="dialogTitle">who are you?</h2>
            <p class="lead" id="dialogDesc">Pick your role and we'll open the right system for you.</p>

            <div class="choices">
                <div class="choice">
                    <a class="choice-btn" id="lecturer" href="#" title="Decision Support System">I'm a lecturer</a>
                    <span class="status" id="status-lecturer" data-state="checking" aria-live="polite"><span class="dot"></span><span class="label">Checking…</span></span>
                </div>
                <div class="choice">
                    <a class="choice-btn" id="student" href="#" title="Student Performance Assistant">I'm a student</a>
                    <span class="status" id="status-student" data-state="checking" aria-live="polite"><span class="dot"></span><span class="label">Checking…</span></span>
                </div>
            </div>

            <div id="notice" role="alert"></div>
        </main>
    </div>

<script>
    // Change these if you run the systems on different ports or host them online.
    // Start commands are run from the repository root.
    const SYSTEMS = {
        lecturer: { url: "https://apfis-lecturer.onrender.com", label: "lecturer system", start: "cd apps/lecturer; flask --app app run --port 5001" },
        student:  { url: "https://apfis-student.onrender.com", label: "student system",  start: "cd apps/student; flask --app app run --port 5002" }
    };

    /* ---------- Dark mode (same key and class as the Lecturer DSS) ---------- */
    (function () {
        const root = document.documentElement;
        const btn = document.getElementById("darkModeToggle");
        const moon = document.getElementById("themeIconMoon");
        const sun = document.getElementById("themeIconSun");

        function paint() {
            const dark = root.classList.contains("dark-mode");
            moon.toggleAttribute("hidden", dark);
            sun.toggleAttribute("hidden", !dark);
            btn.setAttribute("aria-pressed", String(dark));
        }
        btn.addEventListener("click", function () {
            const dark = root.classList.toggle("dark-mode");
            try { localStorage.setItem("spa-theme", dark ? "dark" : "light"); } catch (e) {}
            paint();
        });
        paint();
    })();

    /* ---------- Running / not running checks ---------- */
    const notice = document.getElementById("notice");

    async function isUp(url) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 2500);
        try {
            await fetch(url, { mode: "no-cors", signal: ctrl.signal, cache: "no-store" });
            return true;
        } catch (e) {
            return false;
        } finally {
            clearTimeout(timer);
        }
    }

    async function refresh(key) {
        const el = document.getElementById(key);
        const status = document.getElementById("status-" + key);
        const up = await isUp(SYSTEMS[key].url);
        status.dataset.state = up ? "on" : "off";
        status.querySelector(".label").textContent = up ? "Running" : "Not running";
        el.dataset.up = up;
        return up;
    }

    Object.keys(SYSTEMS).forEach(key => {
        const el = document.getElementById(key);
        el.href = SYSTEMS[key].url;
        refresh(key);

        el.addEventListener("click", async e => {
            if (el.dataset.up === "true") return;          // known to be running: just go
            e.preventDefault();
            if (await refresh(key)) { location.href = SYSTEMS[key].url; return; }
            notice.style.display = "block";
            notice.textContent = "The " + SYSTEMS[key].label + " isn't running yet. Start it in a terminal from the repository root, then click again:";
            const code = document.createElement("code");
            code.textContent = SYSTEMS[key].start;
            notice.appendChild(code);
        });
    });

    document.querySelector(".dialog").focus({ preventScroll: true });
</script>
</body>
</html>
